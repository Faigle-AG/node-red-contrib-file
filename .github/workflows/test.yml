name: Node-RED CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint

    - name: Show environment
      run: |
        node -v
        npm -v
        node -p "require('./node_modules/@faigle/node-red-runtime-utils/package.json').version"
        npm view @faigle/node-red-runtime-utils version

    - run: npm test
